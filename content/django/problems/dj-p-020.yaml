id: dj-p-020
title: A JWT-protected endpoint
difficulty: medium
tags:
  - drf
  - jwt
  - authentication
statement: |
  With `djangorestframework-simplejwt`, expose `POST /token/` (username + password → access
  and refresh tokens) and `GET /me/` returning `{"username": ...}` for a valid `Authorization: Bearer`
  token. `/me/` must answer 401 without a token or with a bad one. Use the fake signing key
  `fake-jwt-key-change-me-abcdefghijklmnopqrstuvwxyz0123456789`.
examples:
  - input: GET /me/ (no token)
    output: "401"
  - input: GET /me/ Bearer <access>
    output: '{"username": "ada"}'
hints:
  - "`JWTAuthentication` in `DEFAULT_AUTHENTICATION_CLASSES`, `IsAuthenticated` permission."
  - "`TokenObtainPairView`."
solution:
  language: python
  code: |
    from playground import migrate, setup

    setup(apps=["rest_framework", "rest_framework_simplejwt"], REST_FRAMEWORK={
        "DEFAULT_AUTHENTICATION_CLASSES": ["rest_framework_simplejwt.authentication.JWTAuthentication"],
        "DEFAULT_PERMISSION_CLASSES": ["rest_framework.permissions.IsAuthenticated"],
    }, SIMPLE_JWT={"SIGNING_KEY": "fake-jwt-key-change-me-abcdefghijklmnopqrstuvwxyz0123456789"})

    from django.urls import path
    from rest_framework.decorators import api_view
    from rest_framework.response import Response
    from rest_framework_simplejwt.views import TokenObtainPairView


    @api_view(["GET"])
    def me(request):
        return Response({"username": request.user.username})


    urlpatterns = [path("token/", TokenObtainPairView.as_view()), path("me/", me)]
    migrate()
  explanation: |
    `TokenObtainPairView` checks the credentials and returns a signed short-lived access token
    and a refresh token. `JWTAuthentication` reads `Authorization: Bearer <token>`, verifies the signature
    (with `SIGNING_KEY`) and expiry, and loads the user from the `user_id` claim. `IsAuthenticated` then
    rejects anonymous requests; because JWT authentication can send a `WWW-Authenticate: Bearer` challenge,
    the rejection is a 401 rather than a 403. The signing key comes from the environment in real projects;
    the fake one here is only for practice.
complexity:
  time: O(1) per request
  space: O(1)
verify: |
  from django.contrib.auth.models import User
  from django.test import Client

  User.objects.create_user("ada", password="correct-horse-battery")
  c = Client()
  assert c.get("/me/").status_code == 401
  pair = c.post("/token/", {"username": "ada", "password": "correct-horse-battery"}).json()
  assert set(pair) == {"access", "refresh"}
  assert c.get("/me/", headers={"Authorization": f"Bearer {pair['access']}"}).json() == {"username": "ada"}
  assert c.get("/me/", headers={"Authorization": "Bearer not.a.token"}).status_code == 401
  assert c.post("/token/", {"username": "ada", "password": "wrong"}).status_code == 401
