id: dj-p-002
title: Product detail with a URL converter
difficulty: easy
tags:
  - urls
  - views
  - converters
statement: |
  `PRODUCTS = {1: "Dune", 2: "Emma"}`. Write `product_detail(request, pk)` at
  `/products/<int:pk>/` returning `{"id": pk, "name": ...}`, or `{"error": "not found"}` with status
  404 for an unknown id. Non-numeric ids must not reach the view.
examples:
  - input: GET /products/2/
    output: '{"id": 2, "name": "Emma"}'
  - input: GET /products/9/
    output: "404"
  - input: GET /products/abc/
    output: "404"
hints:
  - "`<int:pk>` matches digits only and passes an `int`."
  - Pass `status=404` to `JsonResponse`.
solution:
  language: python
  code: |
    from playground import setup

    setup()

    from django.http import JsonResponse
    from django.urls import path

    PRODUCTS = {1: "Dune", 2: "Emma"}


    def product_detail(request, pk):
        if pk not in PRODUCTS:
            return JsonResponse({"error": "not found"}, status=404)
        return JsonResponse({"id": pk, "name": PRODUCTS[pk]})


    urlpatterns = [path("products/<int:pk>/", product_detail, name="product-detail")]
  explanation: |
    The `int` converter does two jobs: it only matches digits, so `/products/abc/` never reaches
    the view (Django returns 404 because no pattern matches), and it converts the captured text to an `int`,
    so `pk in PRODUCTS` compares integers. Inside the view, an unknown id is still possible, and returning
    `JsonResponse(..., status=404)` gives API clients a parseable error with the right status code. Naming
    the URL lets other code build it with `reverse("product-detail", args=[2])` instead of hard-coding the
    path.
complexity:
  time: O(1)
  space: O(1)
verify: |
  from django.test import Client
  from django.urls import reverse

  c = Client()
  assert c.get("/products/2/").json() == {"id": 2, "name": "Emma"}
  assert c.get("/products/1/").json()["name"] == "Dune"
  r = c.get("/products/9/")
  assert r.status_code == 404 and r.json() == {"error": "not found"}
  assert c.get("/products/abc/").status_code == 404
  assert reverse("product-detail", args=[1]) == "/products/1/"
