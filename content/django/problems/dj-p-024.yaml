id: dj-p-024
title: Idempotent order creation
difficulty: hard
tags:
  - api-design
  - idempotency
  - transactions
statement: |
  `POST /orders/` with JSON `{"item": str, "qty": int}` creates an order and returns 201
  `{"id", "item", "qty"}`. It requires an `Idempotency-Key` header (400 without one). Repeating a request
  with the same key and body returns the **same** response (status and body) with header
  `Idempotent-Replayed: true` and creates nothing; the same key with a different body returns 422. The
  order and the stored response must be saved atomically.
examples:
  - input: same POST twice with key k1
    output: 201 and 201 (replayed), one order
hints:
  - Fingerprint the body with `hashlib.sha256(json.dumps(data, sort_keys=True))`.
  - Store key, fingerprint, status and body in a model with `unique=True` on the key.
solution:
  language: python
  code: |
    import hashlib
    import json

    from playground import migrate, setup

    setup(apps=["rest_framework"], REST_FRAMEWORK={
        "DEFAULT_AUTHENTICATION_CLASSES": [], "UNAUTHENTICATED_USER": None,
    })

    from django.db import IntegrityError, models, transaction
    from django.urls import path
    from rest_framework.decorators import api_view
    from rest_framework.response import Response


    class Order(models.Model):
        item = models.CharField(max_length=50)
        qty = models.PositiveIntegerField()


    class IdempotencyRecord(models.Model):
        key = models.CharField(max_length=100, unique=True)
        fingerprint = models.CharField(max_length=64)
        status = models.PositiveSmallIntegerField()
        body = models.JSONField()


    def fingerprint(data):
        return hashlib.sha256(json.dumps(data, sort_keys=True, default=str).encode()).hexdigest()


    def replay(record, digest):
        if record.fingerprint != digest:
            return Response({"error": "Idempotency-Key reused with a different body."}, status=422)
        return Response(record.body, status=record.status, headers={"Idempotent-Replayed": "true"})


    @api_view(["POST"])
    def create_order(request):
        key = request.headers.get("Idempotency-Key", "").strip()
        if not key:
            return Response({"error": "Idempotency-Key header required."}, status=400)
        digest = fingerprint(request.data)
        existing = IdempotencyRecord.objects.filter(key=key).first()
        if existing:
            return replay(existing, digest)
        try:
            with transaction.atomic():
                order = Order.objects.create(item=request.data["item"], qty=int(request.data["qty"]))
                body = {"id": order.pk, "item": order.item, "qty": order.qty}
                IdempotencyRecord.objects.create(key=key, fingerprint=digest, status=201, body=body)
        except IntegrityError:  # a concurrent retry with the same key won the race
            return replay(IdempotencyRecord.objects.get(key=key), digest)
        return Response(body, status=201)


    urlpatterns = [path("orders/", create_order)]
    migrate()
  explanation: |
    A client that times out can't know whether its order was created, so it retries with the
    same key. Looking the key up first answers ordinary retries from the stored response, marked with
    `Idempotent-Replayed`. The fingerprint detects misuse: same key, different body is a client bug (422),
    not a retry. Saving the order and the record in **one transaction** means there's never an order without
    its record (which would let a retry create a duplicate). The unique constraint on the key handles two
    simultaneous retries: the slower one's insert fails, its transaction (and order) rolls back, and it
    replays the winner's response. Real systems also scope keys per user and expire them after a day.
complexity:
  time: O(1) per request (indexed key lookup)
  space: O(requests) stored responses
verify: |
  from django.test import Client

  c = Client()
  post = lambda body, key=None: c.post("/orders/", body, content_type="application/json",
                                       headers={"Idempotency-Key": key} if key else {})
  first, again = post({"item": "Dune", "qty": 2}, "k1"), post({"item": "Dune", "qty": 2}, "k1")
  assert first.status_code == 201 and again.status_code == 201
  assert again.json() == first.json() and again["Idempotent-Replayed"] == "true"
  assert "Idempotent-Replayed" not in first
  assert Order.objects.count() == 1
  assert post({"item": "Dune", "qty": 3}, "k1").status_code == 422
  assert post({"item": "Dune", "qty": 2}).status_code == 400
  assert post({"qty": 2, "item": "Dune"}, "k1").status_code == 201  # key order doesn't matter
  assert post({"item": "Emma", "qty": 1}, "k2").json()["id"] == 2 and Order.objects.count() == 2
