id: py-p-019
title: Rotate a list by k
difficulty: simple
tags:
  - slicing
  - modulo
statement: |
  Write `rotate(items, k)` that returns a new list rotated **right** by `k` places. `k` can be
  larger than the length or negative (rotate left).
constraints:
  - "`-10**9 <= k <= 10**9`"
examples:
  - input: rotate([1, 2, 3, 4, 5], 2)
    output: "[4, 5, 1, 2, 3]"
  - input: rotate([1, 2, 3], -1)
    output: "[2, 3, 1]"
hints:
  - Rotating by `len(items)` changes nothing, so reduce `k` with `%`.
  - Python's `%` already returns a non-negative result for a positive divisor.
solution:
  language: python
  code: |
    def rotate(items: list, k: int) -> list:
        if not items:
            return []
        k %= len(items)  # handles k > len and negative k
        return items[-k:] + items[:-k] if k else items[:]


    print(rotate([1, 2, 3, 4, 5], 2), rotate([1, 2, 3], -1), rotate([1, 2], 10))
  explanation: |
    `k % len(items)` brings any `k` into `0..len-1`. For `-1 % 3`, Python gives `2`, so a left
    rotation by 1 is a right rotation by 2. The empty-list check avoids `% 0`.

    A right rotation by `k` moves the last `k` items to the front: `items[-k:] + items[:-k]`.
    When `k` is 0, `items[-0:]` would be the whole list, so we return a copy directly.
    `collections.deque.rotate` does this in place.
complexity:
  time: O(n)
  space: O(n)
variations:
  - Rotate in place with O(1) extra space (the three-reversal trick).
verify: |
  from collections import deque
  for items in ([], [1], [1, 2, 3, 4, 5]):
      for k in range(-12, 13):
          d = deque(items)
          d.rotate(k)
          assert rotate(items, k) == list(d), (items, k)
