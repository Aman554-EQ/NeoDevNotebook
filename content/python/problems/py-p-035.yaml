id: py-p-035
title: Longest substring without repeats
difficulty: medium
tags:
  - sliding-window
  - dicts
  - strings
statement: |
  Write `longest_unique(text)` that returns the length of the longest substring with no
  repeated character.
constraints:
  - "`0 <= len(text) <= 10**5`"
  - Aim for O(n).
examples:
  - input: longest_unique("abcabcbb")
    output: "3"
    explanation: "'abc'"
  - input: longest_unique("pwwkew")
    output: "3"
    explanation: "'wke'"
hints:
  - Keep a window `text[start:i+1]` with no repeats.
  - Remember the last index of each character; on a repeat, jump `start` past it.
solution:
  language: python
  code: |
    def longest_unique(text: str) -> int:
        last_seen: dict[str, int] = {}
        start = best = 0
        for i, ch in enumerate(text):
            if last_seen.get(ch, -1) >= start:
                start = last_seen[ch] + 1  # move past the earlier copy
            last_seen[ch] = i
            best = max(best, i - start + 1)
        return best


    print(longest_unique("abcabcbb"), longest_unique("pwwkew"), longest_unique(""))
  explanation: |
    We slide a window `[start, i]` that never contains a repeat. When `ch` was last seen
    **inside** the current window (`>= start`), the window must shrink to begin just after
    that earlier copy. Earlier sightings outside the window don't matter.

    Each index moves forward only, so the loop is O(n), instead of O(n²) or worse for
    checking every substring. `best` records the widest valid window seen.
complexity:
  time: O(n)
  space: O(min(n, alphabet))
variations:
  - Return the substring itself, not just its length.
verify: |
  def brute(s):
      return max((j - i for i in range(len(s) + 1) for j in range(i, len(s) + 1) if len(set(s[i:j])) == j - i), default=0)
  for s in ["", "a", "abcabcbb", "bbbbb", "pwwkew", "dvdf", "abba", "tmmzuxt"]:
      assert longest_unique(s) == brute(s), s
