id: py-p-036
title: Merge overlapping intervals
difficulty: medium
tags:
  - sorting
  - intervals
statement: |
  Write `merge(intervals)` that merges all overlapping or touching `[start, end]` intervals
  and returns them sorted by start.
constraints:
  - "`start <= end` for each interval."
examples:
  - input: merge([[1, 3], [8, 10], [2, 6], [10, 12]])
    output: "[[1, 6], [8, 12]]"
hints:
  - Sort by start first. Then each interval can only overlap the LAST merged one.
solution:
  language: python
  code: |
    def merge(intervals: list[list[int]]) -> list[list[int]]:
        merged: list[list[int]] = []
        for start, end in sorted(intervals):
            if merged and start <= merged[-1][1]:  # overlaps or touches
                merged[-1][1] = max(merged[-1][1], end)
            else:
                merged.append([start, end])
        return merged


    print(merge([[1, 3], [8, 10], [2, 6], [10, 12]]), merge([[1, 10], [2, 3]]))
  explanation: |
    After sorting by start, intervals that overlap are next to each other. So we only
    compare each interval with the last merged one: if it starts before (or exactly when)
    that one ends, extend the end. Otherwise start a new block.

    `max(...)` is essential for a contained interval like `[2, 3]` inside `[1, 10]`: the
    end must stay 10. Sorting dominates the cost, at O(n log n).
complexity:
  time: O(n log n)
  space: O(n)
variations:
  - Insert one new interval into an already-merged, sorted list in O(n).
verify: |
  assert merge([[1, 3], [8, 10], [2, 6], [10, 12]]) == [[1, 6], [8, 12]]
  assert merge([]) == []
  assert merge([[1, 10], [2, 3]]) == [[1, 10]]
  assert merge([[5, 6], [1, 2]]) == [[1, 2], [5, 6]]
