id: py-p-048
title: Median of a data stream
difficulty: hard
tags:
  - heapq
  - two-heaps
  - streaming
statement: |
  Implement `RunningMedian` with `add(x)` and `median()`. After any number of additions,
  `median()` returns the median of all values so far (the mean of the two middle values for
  an even count). `add` must be O(log n) and `median` O(1).
constraints:
  - At least one value has been added before `median()` is called.
examples:
  - input: rm.add(5); rm.add(15); rm.median()
    output: "10.0"
  - input: then rm.add(1); rm.median()
    output: "5"
hints:
  - Keep the smaller half in a max-heap and the larger half in a min-heap.
  - Rebalance so the halves differ in size by at most one.
solution:
  language: python
  code: |
    import heapq


    class RunningMedian:
        def __init__(self) -> None:
            self._low: list[float] = []  # max-heap via negated values
            self._high: list[float] = []  # min-heap

        def add(self, x: float) -> None:
            heapq.heappush(self._low, -x)
            # move the largest of the low half up, so every low <= every high
            heapq.heappush(self._high, -heapq.heappop(self._low))
            if len(self._high) > len(self._low):
                heapq.heappush(self._low, -heapq.heappop(self._high))

        def median(self) -> float:
            if len(self._low) > len(self._high):
                return -self._low[0]
            return (-self._low[0] + self._high[0]) / 2


    rm = RunningMedian()
    for value in [5, 15, 1, 3]:
        rm.add(value)
        print(value, rm.median())
  explanation: |
    The median splits the data into a smaller half and a larger half, so we store exactly
    those halves. The max-heap `_low` (negated, because heapq is a min-heap) exposes the
    largest small value, and `_high` exposes the smallest large value. Both are readable
    in O(1).

    Each `add` pushes into `_low`, moves `_low`'s maximum to `_high` (keeping every low ≤
    every high), then rebalances so `_low` has the same size or one more. Then the median
    is either `_low`'s top, or the average of both tops. Each step is O(log n), with no
    sorting.
complexity:
  time: O(log n) add, O(1) median
  space: O(n)
variations:
  - Support removing values too (a sliding-window median).
verify: |
  import random, statistics
  random.seed(2)
  rm, seen = RunningMedian(), []
  for _ in range(500):
      v = random.randint(-50, 50)
      rm.add(v)
      seen.append(v)
      assert rm.median() == statistics.median(seen)
