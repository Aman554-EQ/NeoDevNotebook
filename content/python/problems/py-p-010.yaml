id: py-p-010
title: Find the missing number in 1..n
difficulty: easy
tags:
  - math
  - arithmetic-series
statement: |
  A list contains every integer from `1` to `n` exactly once, except one missing number. The
  list has `n - 1` items in any order. Write `missing_number(nums, n)` in O(n) time and O(1)
  extra space.
constraints:
  - "`2 <= n <= 10**6`"
examples:
  - input: missing_number([3, 1, 5, 2], 5)
    output: "4"
hints:
  - "What is 1 + 2 + … + n? (Gauss: n(n+1)/2.)"
solution:
  language: python
  code: |
    def missing_number(nums: list[int], n: int) -> int:
        expected = n * (n + 1) // 2  # 1 + 2 + ... + n
        return expected - sum(nums)


    print(missing_number([3, 1, 5, 2], 5), missing_number([1], 2))
  explanation: |
    The numbers 1..n always add up to n(n+1)/2. Subtracting the sum of what we actually
    have leaves exactly the missing value.

    Python ints never overflow, so this is safe even for huge `n` (in some languages you'd
    use XOR to avoid overflow). `//` keeps the result an int.
complexity:
  time: O(n)
  space: O(1)
variations:
  - "Two numbers are missing: use the sum AND the sum of squares."
verify: |
  import random
  random.seed(1)
  for n in [2, 5, 100, 1000]:
      nums = list(range(1, n + 1))
      gone = random.choice(nums)
      nums.remove(gone)
      random.shuffle(nums)
      assert missing_number(nums, n) == gone
