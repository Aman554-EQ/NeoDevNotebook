id: py-i-046
question: Why is Python considered slow, and how do you speed up Python code?
difficulty: hard
tags:
  - performance
  - profiling
shortAnswer: |
  Dynamic typing, boxed objects and bytecode interpretation make each operation expensive
  compared with compiled code. Speed up by **profiling first**, then improving algorithms and
  data structures, using built-ins and the standard library (written in C), vectorising with
  NumPy, caching, parallelising I/O or CPU work, and compiling hot spots (Cython, Numba, Rust
  extensions, PyPy).
detailedAnswer: |
  Order of operations:

  1. **Measure:** `cProfile` / `py-spy` for hot functions, `timeit` for micro-benchmarks,
     `tracemalloc` for memory.
  2. **Fix the complexity:** a set instead of a list for membership, a dict index instead of
     nested loops, avoiding repeated work. This gives 100× wins.
  3. **Use C-backed tools:** `sum`, `sorted`, `str.join`, `collections`, `itertools`.
  4. **Cache:** `functools.cache` for pure functions.
  5. **Batch / vectorise:** NumPy and pandas operations on whole arrays.
  6. **Concurrency:** asyncio or threads for I/O, processes for CPU.
  7. **Compile:** Numba, Cython, Rust (PyO3), or run on PyPy.

  Python 3.11+ is roughly 25% faster than 3.10 on average, so upgrading is a cheap first step.
code:
  language: python
  code: |
    import cProfile
    import io
    import pstats


    def slow_unique(items):
        seen = []
        for x in items:
            if x not in seen:  # O(n) scan each time
                seen.append(x)
        return seen


    def fast_unique(items):
        return list(dict.fromkeys(items))


    data = list(range(2000)) * 2
    profiler = cProfile.Profile()
    profiler.runcall(slow_unique, data)
    stats = pstats.Stats(profiler, stream=io.StringIO())
    print(stats.total_calls > 0, slow_unique(data) == fast_unique(data))
pitfalls:
  - Optimising without profiling.
  - Micro-optimising when the algorithm is O(n²).
followUps:
  - How do you profile a running process?
verify: |
  assert fast_unique([3, 1, 3]) == [3, 1]
