id: py-i-056
question: When should you use `assert`, and how do you write a basic pytest test?
difficulty: medium
tags:
  - testing
  - assert
  - pytest
shortAnswer: |
  Use `assert` for internal invariants ("this can't happen if my code is right") and in tests.
  Never use it to validate user input or external data, because `python -O` removes
  assertions. pytest discovers `test_*` functions in `test_*.py` files and uses plain `assert`
  statements, rewriting them to show detailed failure messages.
detailedAnswer: |
  A minimal pytest test is a function: `def test_average(): assert average([2, 4]) == 3`. Run
  it with `pytest -q`.

  Useful features:

  - `pytest.raises(ValueError)` checks that an error is raised.
  - `@pytest.mark.parametrize` runs one test over many inputs.
  - Fixtures (`@pytest.fixture`) provide setup, such as temporary files with `tmp_path`.
  - `pytest.approx` compares floats.

  For input validation, raise a real exception (`ValueError`, `TypeError`). That behaviour is
  part of your function's contract, and it should itself be tested.
code:
  language: python
  code: |
    def average(values: list[float]) -> float:
        if not values:
            raise ValueError("average() of an empty list")
        return sum(values) / len(values)


    def test_average() -> None:
        assert average([2, 4]) == 3
        assert abs(average([0.1, 0.2]) - 0.15) < 1e-12


    def test_average_empty() -> None:
        try:
            average([])
        except ValueError:
            return
        raise AssertionError("expected ValueError")


    test_average()
    test_average_empty()
    print("tests pass")
pitfalls:
  - Validating user input with assert.
  - Testing only the happy path.
followUps:
  - What are pytest fixtures?
  - How do you test code that uses time or the network?
verify: |
  assert average([5]) == 5
